interface=enp63s0
except-interface=lo
bind-interfaces
domain-needed
bogus-priv

# DHCP Pool & Network Options
dhcp-range=10.10.10.50,10.10.10.150,12h
dhcp-option=option:router,10.10.10.1
dhcp-option=option:dns-server,10.10.10.1

# Upstream DNS Forwarders
no-resolv
server=8.8.8.8
server=1.1.1.1

# Custom Local A-Records & Diagnostic Logging
address=/gateway.lab.local/10.10.10.1
address=/app.lab.local/10.10.10.20
log-queries
log-dhcp
